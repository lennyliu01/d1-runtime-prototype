name: WorkOS D1 Candidate Step 6 Deploy

on:
  push:
    branches:
      - workos-d1-candidate
    paths:
      - '.github/workflows/workos-candidate-step6-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE_URL: https://d1-runtime-prototype.lennyliu01.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workos-d1-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - name: Deploy current candidate Worker
        run: npx wrangler deploy
      - name: Verify candidate endpoint is active
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' -X POST "$CANDIDATE_URL/candidate/workos-persistence" -H 'Content-Type: application/json' --data '{"operation":"READ"}')"
          ERROR="$(jq -r '.error // ""' "$BODY_FILE" 2>/dev/null || true)"
          echo "CANDIDATE_ENDPOINT_HTTP=$CODE"
          echo "CANDIDATE_ENDPOINT_ERROR=$ERROR"
          test "$CODE" = "401"
          test "$ERROR" = "UNAUTHORIZED"
