name: WorkOS D1 Candidate Step 4 Safety

on:
  push:
    branches:
      - workos-d1-candidate
    paths:
      - '.github/workflows/workos-candidate-step4-safety.yml'

jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
      CANDIDATE_URL: http://127.0.0.1:8787
      REMOTE_CANDIDATE_URL: https://workos-d1-runtime.lennyliu01.workers.dev
      LOCAL_STATE: .step4-wrangler-state
      REMOTE_WITNESS_RUN: REMOTEWITNESS-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workos-d1-candidate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify remote witness credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RUNTIME_SECRET"

      - name: Apply candidate schema to local D1
        run: npx wrangler d1 migrations apply d1-runtime-prototype-db --local --persist-to "$LOCAL_STATE"

      - name: Verify local candidate tables
        run: |
          set -euo pipefail
          OUT="$(npx wrangler d1 execute d1-runtime-prototype-db --local --persist-to "$LOCAL_STATE" --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('workos_append_records','workos_current_state_versions') ORDER BY name;")"
          echo "$OUT"
          echo "$OUT" | grep -F 'workos_append_records'
          echo "$OUT" | grep -F 'workos_current_state_versions'

      - name: Start local candidate Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 --persist-to "$LOCAL_STATE" --var RUNTIME_SECRET:"$RUNTIME_SECRET" > /tmp/workos-step4-worker.log 2>&1 &
          echo $! > /tmp/workos-step4-worker.pid

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$CANDIDATE_URL/" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/workos-step4-worker.log
            exit 50
          fi

      - name: Run candidate safety matrix
        shell: bash
        run: |
          set -euo pipefail

          post() {
            local payload="$1"
            local out="$2"
            curl -sS -o "$out" -w '%{http_code}'               -X POST "$CANDIDATE_URL/candidate/workos-persistence"               -H "Authorization: Bearer $RUNTIME_SECRET"               -H 'Content-Type: application/json'               --data-binary "$payload"
          }

          unauth_file="$(mktemp)"
          unauth_code="$(curl -sS -o "$unauth_file" -w '%{http_code}'             -X POST "$CANDIDATE_URL/candidate/workos-persistence"             -H 'Content-Type: application/json'             --data '{"operation":"READ"}')"
          test "$unauth_code" = "401"
          jq -e '.status=="FAILED" and .error=="UNAUTHORIZED"' "$unauth_file" >/dev/null

          denied='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"MONITOR","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":1}}'
          denied_file="$(mktemp)"
          denied_code="$(post "$denied" "$denied_file")"
          test "$denied_code" = "403"
          jq -e '.status=="FAILED" and .error=="READ_NOT_AUTHORIZED"' "$denied_file" >/dev/null

          legacy_reader='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"FX_POLICY_READER_HARNESS_V1","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":1}}'
          legacy_reader_file="$(mktemp)"
          legacy_reader_code="$(post "$legacy_reader" "$legacy_reader_file")"
          test "$legacy_reader_code" = "403"
          jq -e '.status=="FAILED" and .error=="READ_NOT_AUTHORIZED"' "$legacy_reader_file" >/dev/null

          legacy_collector="$(jq -cn '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"FX_POLICY_COLLECTOR_HARNESS_V1",
            operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            record_key:"STEP35-LEGACY-CALLER",idempotency_key:"STEP35-LEGACY-CALLER",
            payload:{Probe:"legacy-profile-caller-must-fail"}
          }')"
          legacy_collector_file="$(mktemp)"
          legacy_collector_code="$(post "$legacy_collector" "$legacy_collector_file")"
          test "$legacy_collector_code" = "403"
          jq -e '.status=="FAILED" and .error=="WRITE_NOT_AUTHORIZED"' "$legacy_collector_file" >/dev/null

          overbroad='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"READER","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":101}}'
          overbroad_file="$(mktemp)"
          overbroad_code="$(post "$overbroad" "$overbroad_file")"
          test "$overbroad_code" = "400"
          jq -e '.status=="FAILED" and .error=="INVALID_REQUEST"' "$overbroad_file" >/dev/null

          run_id="STEP4-$(date +%s)-$RANDOM"
          k1="$run_id-A1"
          k2="$run_id-A2"
          k3="$run_id-A3"
          idem1="$run_id-IDEM1"
          idem2="$run_id-IDEM2"
          idem3="$run_id-IDEM3"

          append1="$(jq -cn --arg rk "$k1" --arg idem "$idem1" --arg rid "$run_id" '{
            execution_surface:"CHAT",trigger_mode:"HUMAN",
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"COLLECTOR",
            operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            record_key:$rk,idempotency_key:$idem,payload:{Run_ID:$rid,Status:"SUCCESS",Probe:"append-1"}
          }')"
          a1_file="$(mktemp)"
          a1_code="$(post "$append1" "$a1_file")"
          test "$a1_code" = "200"
          jq -e '.status=="SUCCESS" and .write_mode=="APPEND_ONLY" and .replayed==false and (.invocation_id|length>0) and (.db_written_at|length>0) and (.db_read_at|length>0)' "$a1_file" >/dev/null
          inv1="$(jq -r '.invocation_id' "$a1_file")"
          seq1="$(jq -r '.append_seq' "$a1_file")"

          replay_file="$(mktemp)"
          replay_code="$(post "$append1" "$replay_file")"
          test "$replay_code" = "200"
          jq -e --arg inv "$inv1" --argjson seq "$seq1" '.status=="SUCCESS" and .replayed==true and .invocation_id==$inv and .append_seq==$seq' "$replay_file" >/dev/null

          reordered="$(jq -cn --arg rk "$k1" --arg idem "$idem1" --arg rid "$run_id" '{
            idempotency_key:$idem,
            record_key:$rk,
            instance_id:"SINGLETON",
            dataset_id:"FX_POLICY_RUN_LOG",
            operation:"WRITE",
            caller_identity:"COLLECTOR",
            task_id:"US_JAPAN_FX_POLICY",
            trigger_mode:"HUMAN",
            execution_surface:"CHAT",
            payload:{Status:"SUCCESS",Probe:"append-1",Run_ID:$rid}
          }')"
          reordered_file="$(mktemp)"
          reordered_code="$(post "$reordered" "$reordered_file")"
          test "$reordered_code" = "200"
          jq -e --arg inv "$inv1" --argjson seq "$seq1" '.status=="SUCCESS" and .replayed==true and .invocation_id==$inv and .append_seq==$seq' "$reordered_file" >/dev/null

          conflict="$(echo "$append1" | jq '.payload.Probe="changed"')"
          conflict_file="$(mktemp)"
          conflict_code="$(post "$conflict" "$conflict_file")"
          test "$conflict_code" = "409"
          jq -e '.status=="FAILED" and .error=="IDEMPOTENCY_CONFLICT"' "$conflict_file" >/dev/null

          duplicate="$(echo "$append1" | jq --arg idem "$run_id-IDEM-DUP" '.idempotency_key=$idem')"
          duplicate_file="$(mktemp)"
          duplicate_code="$(post "$duplicate" "$duplicate_file")"
          test "$duplicate_code" = "409"
          jq -e '.status=="FAILED" and .error=="DUPLICATE_RECORD"' "$duplicate_file" >/dev/null

          record_read="$(jq -cn --arg rk "$k1" '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"COLLECTOR",
            operation:"READ",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            selector:{kind:"RECORD",record_key:$rk}
          }')"
          rr_file="$(mktemp)"
          rr_code="$(post "$record_read" "$rr_file")"
          test "$rr_code" = "200"
          jq -e --arg rk "$k1" --arg inv "$inv1" '.status=="SUCCESS" and .selector=="RECORD" and .record.record_key==$rk and .record.invocation_id==$inv and .record.payload.Probe=="append-1"' "$rr_file" >/dev/null

          for spec in "$k2:$idem2:append-2" "$k3:$idem3:append-3"; do
            rk="${spec%%:*}"
            rest="${spec#*:}"
            idem="${rest%%:*}"
            probe="${rest#*:}"
            req="$(jq -cn --arg rk "$rk" --arg idem "$idem" --arg rid "$run_id" --arg probe "$probe" '{
              task_id:"US_JAPAN_FX_POLICY",caller_identity:"COLLECTOR",
              operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
              record_key:$rk,idempotency_key:$idem,payload:{Run_ID:$rid,Status:"SUCCESS",Probe:$probe}
            }')"
            f="$(mktemp)"
            c="$(post "$req" "$f")"
            test "$c" = "200"
            jq -e '.status=="SUCCESS"' "$f" >/dev/null
          done

          after="$(jq -cn --arg rk "$k1" '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"READER",
            operation:"READ",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            selector:{kind:"AFTER",checkpoint_record_key:$rk,limit:2}
          }')"
          after_file="$(mktemp)"
          after_code="$(post "$after" "$after_file")"
          test "$after_code" = "200"
          jq -e --arg k2 "$k2" --arg k3 "$k3" '.status=="SUCCESS" and .selector=="AFTER" and (.records|length)==2 and .records[0].record_key==$k2 and .records[1].record_key==$k3' "$after_file" >/dev/null

          tail="$(jq -cn '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"READER",
            operation:"READ",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            selector:{kind:"TAIL",limit:2}
          }')"
          tail_file="$(mktemp)"
          tail_code="$(post "$tail" "$tail_file")"
          test "$tail_code" = "200"
          jq -e '(.records|length)==2' "$tail_file" >/dev/null

          company="ENPLAS"
          cur_idem1="$run_id-CUR1"
          cur_idem2="$run_id-CUR2"
          cur_init="$(jq -cn --arg idem "$cur_idem1" --arg marker "$run_id" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:0,idempotency_key:$idem,payload:{Probe:$marker,State:"V1"}
          }')"
          ci_file="$(mktemp)"
          ci_code="$(post "$cur_init" "$ci_file")"
          if [ "$ci_code" = "409" ]; then
            current_read='{"task_id":"ROLLING_WEDGE_INVESTMENT","caller_identity":"Rolling_Wedge_Workflow","operation":"READ","dataset_id":"RW_CURRENT_STATE","instance_id":"ENPLAS","selector":{"kind":"CURRENT"}}'
            cr0_file="$(mktemp)"
            cr0_code="$(post "$current_read" "$cr0_file")"
            test "$cr0_code" = "200"
            base_version="$(jq -r '.version' "$cr0_file")"
          else
            test "$ci_code" = "200"
            jq -e '.status=="SUCCESS" and .version==1 and .previous_version==0 and .replayed==false' "$ci_file" >/dev/null
            base_version=1
            ci_replay="$(mktemp)"
            ci_replay_code="$(post "$cur_init" "$ci_replay")"
            test "$ci_replay_code" = "200"
            jq -e '.status=="SUCCESS" and .replayed==true and .version==1' "$ci_replay" >/dev/null
          fi

          stale_req="$(jq -cn --arg idem "$run_id-CUR-STALE" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:0,idempotency_key:$idem,payload:{Probe:"stale"}
          }')"
          stale_file="$(mktemp)"
          stale_code="$(post "$stale_req" "$stale_file")"
          test "$stale_code" = "409"
          jq -e '.status=="FAILED" and .error=="STALE_STATE"' "$stale_file" >/dev/null

          transition="$(jq -cn --arg idem "$cur_idem2" --argjson ev "$base_version" --arg marker "$run_id" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:$ev,idempotency_key:$idem,payload:{Probe:$marker,State:"NEXT"}
          }')"
          tr_file="$(mktemp)"
          tr_code="$(post "$transition" "$tr_file")"
          test "$tr_code" = "200"
          next_version="$(jq -r '.version' "$tr_file")"
          test "$next_version" -eq "$((base_version+1))"
          jq -e '.status=="SUCCESS" and .replayed==false and (.db_read_at|length>0)' "$tr_file" >/dev/null
          tr_inv="$(jq -r '.invocation_id' "$tr_file")"

          tr_replay_file="$(mktemp)"
          tr_replay_code="$(post "$transition" "$tr_replay_file")"
          test "$tr_replay_code" = "200"
          jq -e --arg inv "$tr_inv" --argjson v "$next_version" '.status=="SUCCESS" and .replayed==true and .invocation_id==$inv and .version==$v' "$tr_replay_file" >/dev/null

          current_read='{"task_id":"ROLLING_WEDGE_INVESTMENT","caller_identity":"Rolling_Wedge_Workflow","operation":"READ","dataset_id":"RW_CURRENT_STATE","instance_id":"ENPLAS","selector":{"kind":"CURRENT"}}'
          cr_file="$(mktemp)"
          cr_code="$(post "$current_read" "$cr_file")"
          test "$cr_code" = "200"
          jq -e --argjson v "$next_version" --arg marker "$run_id" '.status=="SUCCESS" and .selector=="CURRENT" and .version==$v and .payload.Probe==$marker' "$cr_file" >/dev/null

          cw1="$(jq -cn --arg idem "$run_id-CW1" --argjson ev "$next_version" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:$ev,idempotency_key:$idem,payload:{Probe:"compete-1"}
          }')"
          cw2="$(jq -cn --arg idem "$run_id-CW2" --argjson ev "$next_version" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:$ev,idempotency_key:$idem,payload:{Probe:"compete-2"}
          }')"
          c1f="$(mktemp)"; c2f="$(mktemp)"; c1c="$(mktemp)"; c2c="$(mktemp)"
          (post "$cw1" "$c1f" >"$c1c") & p1=$!
          (post "$cw2" "$c2f" >"$c2c") & p2=$!
          wait "$p1"; wait "$p2"
          code1="$(cat "$c1c")"; code2="$(cat "$c2c")"
          successes=0; stales=0
          for pair in "$code1:$c1f" "$code2:$c2f"; do
            code="${pair%%:*}"; file="${pair#*:}"
            if [ "$code" = "200" ]; then
              jq -e '.status=="SUCCESS"' "$file" >/dev/null
              successes=$((successes+1))
            elif [ "$code" = "409" ]; then
              jq -e '.status=="FAILED" and .error=="STALE_STATE"' "$file" >/dev/null
              stales=$((stales+1))
            else
              echo "Unexpected competing-writer status: $code"
              cat "$file"
              exit 60
            fi
          done
          test "$successes" -eq 1
          test "$stales" -eq 1

          amb_key="$run_id-AMB"
          amb_idem="$run_id-AMB-IDEM"
          ambiguous="$(jq -cn --arg rk "$amb_key" --arg idem "$amb_idem" '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"COLLECTOR",
            operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            record_key:$rk,idempotency_key:$idem,payload:{Probe:"ambiguous-outcome"}
          }')"
          ignored_file="$(mktemp)"
          ignored_code="$(post "$ambiguous" "$ignored_file")"
          test "$ignored_code" = "200"
          original_amb_inv="$(jq -r '.invocation_id' "$ignored_file")"

          amb_retry_file="$(mktemp)"
          amb_retry_code="$(post "$ambiguous" "$amb_retry_file")"
          test "$amb_retry_code" = "200"
          jq -e --arg inv "$original_amb_inv" '.status=="SUCCESS" and .replayed==true and .invocation_id==$inv' "$amb_retry_file" >/dev/null

          append_count="$(npx wrangler d1 execute d1-runtime-prototype-db --local --persist-to "$LOCAL_STATE" --command "SELECT COUNT(*) AS c FROM workos_append_records;" --json | jq -r '.[0].results[0].c')"
          current_count="$(npx wrangler d1 execute d1-runtime-prototype-db --local --persist-to "$LOCAL_STATE" --command "SELECT COUNT(*) AS c FROM workos_current_state_versions;" --json | jq -r '.[0].results[0].c')"
          test "$append_count" -eq 4
          test "$current_count" -eq 3

          echo "STEP4_SAFETY_RESULT=PASS"
          echo "RUN_ID=$run_id"
          echo "APPEND_ROWS=$append_count"
          echo "CURRENT_STATE_VERSIONS=$current_count"

          kill "$(cat /tmp/workos-step4-worker.pid)" || true

      - name: Require empty remote candidate tables
        shell: bash
        run: |
          set -euo pipefail
          APPEND_COUNT="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_append_records;" --json | jq -r '.[0].results[0].c')"
          CURRENT_COUNT="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_current_state_versions;" --json | jq -r '.[0].results[0].c')"
          echo "REMOTE_PRECHECK_APPEND_ROWS=$APPEND_COUNT"
          echo "REMOTE_PRECHECK_CURRENT_STATE_VERSIONS=$CURRENT_COUNT"
          test "$APPEND_COUNT" -eq 0
          test "$CURRENT_COUNT" -eq 0

      - name: Ensure canonical WorkOS D1 Worker resource exists
        shell: bash
        run: |
          set -euo pipefail

          GET_FILE="$(mktemp)"
          GET_CODE="$(curl -sS -o "$GET_FILE" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/workos-d1-runtime" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$GET_CODE" = "200" ]; then
            echo "REMOTE_WORKER_RESOURCE=EXISTING"
          else
            META_FILE="$(mktemp)"
            MODULE_FILE="$(mktemp --suffix=.js)"
            printf '%s\n' '{"main_module":"worker.js","compatibility_date":"2026-09-22"}' > "$META_FILE"
            printf '%s\n' 'export default { async fetch() { return new Response("workos-d1-runtime candidate draft"); } };' > "$MODULE_FILE"

            PUT_FILE="$(mktemp)"
            PUT_CODE="$(curl -sS -o "$PUT_FILE" -w '%{http_code}' \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/workos-d1-runtime" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "metadata=@$META_FILE;type=application/json" \
              -F "worker.js=@$MODULE_FILE;type=application/javascript+module")"
            echo "REMOTE_WORKER_CREATE_HTTP=$PUT_CODE"
            if [ "$PUT_CODE" != "200" ]; then
              jq -c '{success,errors,messages}' "$PUT_FILE" || cat "$PUT_FILE"
              exit 62
            fi
            jq -e '.success == true and .result.id == "workos-d1-runtime"' "$PUT_FILE" >/dev/null
            echo "REMOTE_WORKER_RESOURCE=CREATED"
          fi

      - name: Deploy canonical non-authoritative WorkOS D1 Worker
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          printf 'RUNTIME_SECRET=%s\n' "$RUNTIME_SECRET" > "$SECRETS_FILE"
          npx wrangler deploy --secrets-file "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"
          echo "REMOTE_WORKER_DEPLOYED=TRUE"

      - name: Run remote Worker witness
        shell: bash
        run: |
          set -euo pipefail

          post_remote() {
            local payload="$1"
            local out="$2"
            curl -sS -o "$out" -w '%{http_code}'               -X POST "$REMOTE_CANDIDATE_URL/candidate/workos-persistence"               -H "Authorization: Bearer $RUNTIME_SECRET"               -H 'Content-Type: application/json'               --data-binary "$payload"
          }

          unauth_file="$(mktemp)"
          unauth_code="$(curl -sS -o "$unauth_file" -w '%{http_code}'             -X POST "$REMOTE_CANDIDATE_URL/candidate/workos-persistence"             -H 'Content-Type: application/json'             --data '{"operation":"READ"}')"
          test "$unauth_code" = "401"
          jq -e '.status=="FAILED" and .error=="UNAUTHORIZED"' "$unauth_file" >/dev/null

          cross_task='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"MONITOR","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":1}}'
          cross_file="$(mktemp)"
          cross_code="$(post_remote "$cross_task" "$cross_file")"
          test "$cross_code" = "403"
          jq -e '.status=="FAILED" and .error=="READ_NOT_AUTHORIZED"' "$cross_file" >/dev/null

          legacy_read='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"FX_POLICY_READER_HARNESS_V1","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":1}}'
          legacy_read_file="$(mktemp)"
          legacy_read_code="$(post_remote "$legacy_read" "$legacy_read_file")"
          test "$legacy_read_code" = "403"
          jq -e '.status=="FAILED" and .error=="READ_NOT_AUTHORIZED"' "$legacy_read_file" >/dev/null

          legacy_write="$(jq -cn --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"FX_POLICY_COLLECTOR_HARNESS_V1",
            operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            record_key:($run+"-LEGACY"),idempotency_key:($run+"-LEGACY"),
            payload:{Probe:"legacy-caller-must-fail"}
          }')"
          legacy_write_file="$(mktemp)"
          legacy_write_code="$(post_remote "$legacy_write" "$legacy_write_file")"
          test "$legacy_write_code" = "403"
          jq -e '.status=="FAILED" and .error=="WRITE_NOT_AUTHORIZED"' "$legacy_write_file" >/dev/null

          overbroad='{"task_id":"US_JAPAN_FX_POLICY","caller_identity":"READER","operation":"READ","dataset_id":"FX_POLICY_RUN_LOG","instance_id":"SINGLETON","selector":{"kind":"TAIL","limit":101}}'
          overbroad_file="$(mktemp)"
          overbroad_code="$(post_remote "$overbroad" "$overbroad_file")"
          test "$overbroad_code" = "400"
          jq -e '.status=="FAILED" and .error=="INVALID_REQUEST"' "$overbroad_file" >/dev/null

          fx_key="$REMOTE_WITNESS_RUN-FX-RUN"
          fx_idem="$REMOTE_WITNESS_RUN-FX-RUN-IDEM"
          fx_write="$(jq -cn --arg rk "$fx_key" --arg idem "$fx_idem" --arg run "$REMOTE_WITNESS_RUN" '{
            execution_surface:"CHAT",trigger_mode:"HUMAN",
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"COLLECTOR",
            operation:"WRITE",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            record_key:$rk,idempotency_key:$idem,payload:{Probe:"remote-fx-collector",Run_ID:$run}
          }')"
          fx_file="$(mktemp)"
          fx_code="$(post_remote "$fx_write" "$fx_file")"
          test "$fx_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="COLLECTOR" and .write_mode=="APPEND_ONLY" and .replayed==false and (.invocation_id|length>0) and (.db_read_at|length>0)' "$fx_file" >/dev/null
          fx_inv="$(jq -r '.invocation_id' "$fx_file")"

          fx_replay_file="$(mktemp)"
          fx_replay_code="$(post_remote "$fx_write" "$fx_replay_file")"
          test "$fx_replay_code" = "200"
          jq -e --arg inv "$fx_inv" '.status=="SUCCESS" and .replayed==true and .invocation_id==$inv' "$fx_replay_file" >/dev/null

          fx_read="$(jq -cn --arg rk "$fx_key" '{
            execution_surface:"WORK",trigger_mode:"HUMAN",
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"READER",
            operation:"READ",dataset_id:"FX_POLICY_RUN_LOG",instance_id:"SINGLETON",
            selector:{kind:"RECORD",record_key:$rk}
          }')"
          fx_read_file="$(mktemp)"
          fx_read_code="$(post_remote "$fx_read" "$fx_read_file")"
          test "$fx_read_code" = "200"
          jq -e --arg inv "$fx_inv" '.status=="SUCCESS" and .caller_identity=="READER" and .selector=="RECORD" and .record.invocation_id==$inv' "$fx_read_file" >/dev/null

          fx_analysis_key="$REMOTE_WITNESS_RUN-FX-ANALYSIS"
          fx_analysis="$(jq -cn --arg rk "$fx_analysis_key" --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"US_JAPAN_FX_POLICY",caller_identity:"READER",
            operation:"WRITE",dataset_id:"FX_POLICY_ANALYSIS_STATE",instance_id:"SINGLETON",
            record_key:$rk,idempotency_key:($run+"-FX-ANALYSIS-IDEM"),
            payload:{Probe:"remote-fx-reader"}
          }')"
          fx_analysis_file="$(mktemp)"
          fx_analysis_code="$(post_remote "$fx_analysis" "$fx_analysis_file")"
          test "$fx_analysis_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="READER" and .write_mode=="APPEND_ONLY"' "$fx_analysis_file" >/dev/null

          rw_evidence_key="$REMOTE_WITNESS_RUN-RW-EVIDENCE"
          rw_evidence="$(jq -cn --arg rk "$rw_evidence_key" --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"MONITOR",
            operation:"WRITE",dataset_id:"RW_EVIDENCE_HISTORY",instance_id:"ENPLAS",
            record_key:$rk,idempotency_key:($run+"-RW-EVIDENCE-IDEM"),
            payload:{Probe:"remote-rw-monitor"}
          }')"
          rw_evidence_file="$(mktemp)"
          rw_evidence_code="$(post_remote "$rw_evidence" "$rw_evidence_file")"
          test "$rw_evidence_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="MONITOR"' "$rw_evidence_file" >/dev/null

          rw_revision_key="$REMOTE_WITNESS_RUN-RW-REVISION"
          rw_revision="$(jq -cn --arg rk "$rw_revision_key" --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"REVISER",
            operation:"WRITE",dataset_id:"RW_REVISION_HISTORY",instance_id:"ENPLAS",
            record_key:$rk,idempotency_key:($run+"-RW-REVISION-IDEM"),
            payload:{Probe:"remote-rw-reviser"}
          }')"
          rw_revision_file="$(mktemp)"
          rw_revision_code="$(post_remote "$rw_revision" "$rw_revision_file")"
          test "$rw_revision_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="REVISER"' "$rw_revision_file" >/dev/null

          rw_valuation_key="$REMOTE_WITNESS_RUN-RW-VALUATION"
          rw_valuation="$(jq -cn --arg rk "$rw_valuation_key" --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"VALUATOR",
            operation:"WRITE",dataset_id:"RW_VALUATION_HISTORY",instance_id:"ENPLAS",
            record_key:$rk,idempotency_key:($run+"-RW-VALUATION-IDEM"),
            payload:{Probe:"remote-rw-valuator"}
          }')"
          rw_valuation_file="$(mktemp)"
          rw_valuation_code="$(post_remote "$rw_valuation" "$rw_valuation_file")"
          test "$rw_valuation_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="VALUATOR"' "$rw_valuation_file" >/dev/null

          rw_decision_key="$REMOTE_WITNESS_RUN-RW-DECISION-RUN"
          rw_decision="$(jq -cn --arg rk "$rw_decision_key" --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"DECISION",
            operation:"WRITE",dataset_id:"RW_RUN_LOG",instance_id:"ENPLAS",
            record_key:$rk,idempotency_key:($run+"-RW-DECISION-IDEM"),
            payload:{Probe:"remote-rw-decision"}
          }')"
          rw_decision_file="$(mktemp)"
          rw_decision_code="$(post_remote "$rw_decision" "$rw_decision_file")"
          test "$rw_decision_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="DECISION"' "$rw_decision_file" >/dev/null

          current1="$(jq -cn --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:0,idempotency_key:($run+"-CUR1"),
            payload:{Probe:"remote-current",State:"V1"}
          }')"
          current1_file="$(mktemp)"
          current1_code="$(post_remote "$current1" "$current1_file")"
          test "$current1_code" = "200"
          jq -e '.status=="SUCCESS" and .caller_identity=="Rolling_Wedge_Workflow" and .version==1 and .previous_version==0 and .replayed==false and (.db_read_at|length>0)' "$current1_file" >/dev/null

          current2="$(jq -cn --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:1,idempotency_key:($run+"-CUR2"),
            payload:{Probe:"remote-current",State:"V2"}
          }')"
          current2_file="$(mktemp)"
          current2_code="$(post_remote "$current2" "$current2_file")"
          test "$current2_code" = "200"
          current2_inv="$(jq -r '.invocation_id' "$current2_file")"
          jq -e '.status=="SUCCESS" and .version==2 and .previous_version==1 and .replayed==false' "$current2_file" >/dev/null

          current2_replay_file="$(mktemp)"
          current2_replay_code="$(post_remote "$current2" "$current2_replay_file")"
          test "$current2_replay_code" = "200"
          jq -e --arg inv "$current2_inv" '.status=="SUCCESS" and .version==2 and .replayed==true and .invocation_id==$inv' "$current2_replay_file" >/dev/null

          stale="$(jq -cn --arg run "$REMOTE_WITNESS_RUN" '{
            task_id:"ROLLING_WEDGE_INVESTMENT",caller_identity:"Rolling_Wedge_Workflow",
            operation:"WRITE",dataset_id:"RW_CURRENT_STATE",instance_id:"ENPLAS",
            expected_version:1,idempotency_key:($run+"-CUR-STALE"),
            payload:{Probe:"remote-stale"}
          }')"
          stale_file="$(mktemp)"
          stale_code="$(post_remote "$stale" "$stale_file")"
          test "$stale_code" = "409"
          jq -e '.status=="FAILED" and .error=="STALE_STATE" and .current_version==2' "$stale_file" >/dev/null

          current_read='{"task_id":"ROLLING_WEDGE_INVESTMENT","caller_identity":"Rolling_Wedge_Workflow","operation":"READ","dataset_id":"RW_CURRENT_STATE","instance_id":"ENPLAS","selector":{"kind":"CURRENT"}}'
          current_read_file="$(mktemp)"
          current_read_code="$(post_remote "$current_read" "$current_read_file")"
          test "$current_read_code" = "200"
          jq -e '.status=="SUCCESS" and .selector=="CURRENT" and .version==2 and .payload.State=="V2"' "$current_read_file" >/dev/null

          append_count="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_append_records WHERE idempotency_key LIKE '$REMOTE_WITNESS_RUN-%';" --json | jq -r '.[0].results[0].c')"
          current_count="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_current_state_versions WHERE idempotency_key LIKE '$REMOTE_WITNESS_RUN-%';" --json | jq -r '.[0].results[0].c')"
          test "$append_count" -eq 6
          test "$current_count" -eq 2

          echo "REMOTE_STEP4_WITNESS_RESULT=PASS"
          echo "REMOTE_APPEND_ROWS=$append_count"
          echo "REMOTE_CURRENT_STATE_VERSIONS=$current_count"

      - name: Cleanup remote witness rows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "DELETE FROM workos_append_records WHERE idempotency_key LIKE '$REMOTE_WITNESS_RUN-%';"
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "DELETE FROM workos_current_state_versions WHERE idempotency_key LIKE '$REMOTE_WITNESS_RUN-%';"
          APPEND_COUNT="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_append_records;" --json | jq -r '.[0].results[0].c')"
          CURRENT_COUNT="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS c FROM workos_current_state_versions;" --json | jq -r '.[0].results[0].c')"
          echo "REMOTE_POSTCLEAN_APPEND_ROWS=$APPEND_COUNT"
          echo "REMOTE_POSTCLEAN_CURRENT_STATE_VERSIONS=$CURRENT_COUNT"
          test "$APPEND_COUNT" -eq 0
          test "$CURRENT_COUNT" -eq 0



