name: Prototype 1 State Initialization Acceptance

on:
  issues:
    types:
      - opened

jobs:
  initialize:
    if: github.event.issue.title == '[P1_STATE] INITIALIZE_ACCEPTANCE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required secrets are available
        run: |
          test -n "$RUNTIME_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install

      - name: Initialize fresh authoritative state
        id: init
        shell: bash
        run: |
          set -euo pipefail
          STATE_KEY="p1-init-issue-${{ github.event.issue.number }}"
          IDEMPOTENCY_KEY="p1-init-key-${{ github.event.issue.number }}"
          SOURCE_RUN_KEY="p1-init-source-${{ github.event.issue.number }}"
          REQUEST_FILE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"

          jq -n             --arg state_key "$STATE_KEY"             --arg idempotency_key "$IDEMPOTENCY_KEY"             --arg source "$SOURCE_RUN_KEY"             '{
              execution_surface: "CHAT",
              trigger_mode: "HUMAN",
              operation: "STATE_COMPARE_AND_SET",
              state_key: $state_key,
              expected_version: 0,
              expected_state: null,
              next_state: "STATE_1",
              idempotency_key: $idempotency_key,
              source_run_key: $source
            }' > "$REQUEST_FILE"

          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}'             -X POST https://d1-runtime-prototype.lennyliu01.workers.dev/prototype/state-cas             -H "Authorization: Bearer $RUNTIME_SECRET"             -H 'Content-Type: application/json'             --data-binary @"$REQUEST_FILE")"

          RESPONSE="$(cat "$RESPONSE_FILE")"
          echo "HTTP: $HTTP_CODE"
          echo "Runtime response: $RESPONSE"

          test "$HTTP_CODE" = "200"
          echo "$RESPONSE" | jq -e             --arg state_key "$STATE_KEY"             --arg idempotency_key "$IDEMPOTENCY_KEY"             '
              .status == "SUCCESS" and
              .execution_surface == "CHAT" and
              .trigger_mode == "HUMAN" and
              .operation == "STATE_COMPARE_AND_SET" and
              .state_key == $state_key and
              .previous_version == 0 and
              .previous_state == null and
              .version == 1 and
              .state == "STATE_1" and
              .idempotency_key == $idempotency_key and
              .replayed == false and
              (.invocation_id | type == "string" and length > 0) and
              (.db_written_at | type == "string" and length > 0) and
              (.db_read_at | type == "string" and length > 0)
            ' >/dev/null

          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"
          echo "invocation_id=$(echo "$RESPONSE" | jq -r '.invocation_id')" >> "$GITHUB_OUTPUT"
          echo "db_written_at=$(echo "$RESPONSE" | jq -r '.db_written_at')" >> "$GITHUB_OUTPUT"
          echo "db_read_at=$(echo "$RESPONSE" | jq -r '.db_read_at')" >> "$GITHUB_OUTPUT"

      - name: Independently verify exact persisted state
        shell: bash
        run: |
          set -euo pipefail
          STATE_KEY="${{ steps.init.outputs.state_key }}"
          IDEMPOTENCY_KEY="${{ steps.init.outputs.idempotency_key }}"
          INVOCATION_ID="${{ steps.init.outputs.invocation_id }}"
          DB_WRITTEN_AT="${{ steps.init.outputs.db_written_at }}"

          npx wrangler d1 execute d1-runtime-prototype-db             --remote             --json             --command "SELECT state_key, version, state_value, previous_version, previous_state, invocation_id, idempotency_key, execution_surface, trigger_mode, operation, db_written_at FROM prototype_state_versions WHERE state_key = '$STATE_KEY';"             > p1-init-row.json

          npx wrangler d1 execute d1-runtime-prototype-db             --remote             --json             --command "SELECT COUNT(*) AS row_count FROM prototype_state_versions WHERE state_key = '$STATE_KEY';"             > p1-init-count.json

          echo "Persisted row:"
          cat p1-init-row.json
          echo "Row count:"
          cat p1-init-count.json

          jq -e             --arg state_key "$STATE_KEY"             --arg idempotency_key "$IDEMPOTENCY_KEY"             --arg invocation_id "$INVOCATION_ID"             --arg written "$DB_WRITTEN_AT"             '
              [
                .. | objects |
                select(
                  .state_key? == $state_key and
                  .version? == 1 and
                  .state_value? == "STATE_1" and
                  .previous_version? == 0 and
                  .previous_state? == null and
                  .invocation_id? == $invocation_id and
                  .idempotency_key? == $idempotency_key and
                  .execution_surface? == "CHAT" and
                  .trigger_mode? == "HUMAN" and
                  .operation? == "STATE_COMPARE_AND_SET" and
                  .db_written_at? == $written
                )
              ] | length == 1
            ' p1-init-row.json >/dev/null

          jq -e '
            [
              .. | objects |
              select(.row_count? == 1)
            ] | length >= 1
          ' p1-init-count.json >/dev/null

      - name: Post initialization success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE_KEY: ${{ steps.init.outputs.state_key }}
          IDEMPOTENCY_KEY: ${{ steps.init.outputs.idempotency_key }}
          INVOCATION_ID: ${{ steps.init.outputs.invocation_id }}
          DB_WRITTEN_AT: ${{ steps.init.outputs.db_written_at }}
          DB_READ_AT: ${{ steps.init.outputs.db_read_at }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "P1_STATE_INIT_RESULT
          Status: SUCCESS
          State_Key: $STATE_KEY
          Previous_Version: 0
          Previous_State: null
          Version: 1
          State: STATE_1
          Idempotency_Key: $IDEMPOTENCY_KEY
          Invocation_ID: $INVOCATION_ID
          DB_Written_At: $DB_WRITTEN_AT
          DB_Read_At: $DB_READ_AT
          Replayed: false
          Persisted_Row_Count: 1
          Independent_D1_Exact_Row_Verification: SUCCESS"

      - name: Post initialization failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "P1_STATE_INIT_RESULT
          Status: FAILED
          Inspect the matching GitHub Actions run for the exact failed assertion."
