name: Apply Prototype 0 D1 Migration

on:
  issues:
    types:
      - opened

jobs:
  migrate:
    if: github.event.issue.title == '[D1_MIGRATION] APPLY_PROTOTYPE_0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply d1-runtime-prototype-db --remote

      - name: Verify prototype table
        run: |
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='prototype_invocations';"

      - name: Post migration success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "D1_MIGRATION_RESULT
          Status: SUCCESS
          Database: d1-runtime-prototype-db
          Table: prototype_invocations
          Migration: 0001_create_prototype_invocations.sql"

      - name: Post migration failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "D1_MIGRATION_RESULT
          Status: FAILED
          Database: d1-runtime-prototype-db
          Migration: 0001_create_prototype_invocations.sql
          Inspect the matching GitHub Actions run for the exact failed step."
