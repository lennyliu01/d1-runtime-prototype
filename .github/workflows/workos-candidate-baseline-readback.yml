name: WorkOS D1 Candidate Baseline Readback

on:
  push:
    branches:
      - workos-d1-candidate
    paths:
      - '.github/workflows/workos-candidate-baseline-readback.yml'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workos-d1-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Fresh readback D1 against Step 5 snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          gh api "repos/$GITHUB_REPOSITORY/contents/.step5/step5-source-snapshot-20260924.json?ref=aa4fa0ff8e6367260d3459f026ec15721f02d13e" --jq .content | tr -d '\n' | base64 -d > /tmp/snapshot.json
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT dataset_id,instance_id,record_key,payload_json FROM workos_append_records ORDER BY append_seq;" --json > /tmp/append.json
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT dataset_id,instance_id,version,previous_version,payload_json FROM workos_current_state_versions ORDER BY dataset_id,instance_id,version;" --json > /tmp/current.json
          node <<'NODE'
          const fs=require("fs");
          const snap=JSON.parse(fs.readFileSync("/tmp/snapshot.json","utf8"));
          const unwrap=p=>JSON.parse(fs.readFileSync(p,"utf8"))[0].results;
          const append=unwrap("/tmp/append.json");
          const current=unwrap("/tmp/current.json");
          const ea=[],ec=[];
          for(const d of snap.datasets){
            if(d.write_mode==="APPEND_ONLY"){
              for(const r of d.records) ea.push({dataset_id:d.dataset_id,instance_id:d.instance_id,record_key:String(r[d.record_key_field]),payload:r});
            } else {
              ec.push({dataset_id:d.dataset_id,instance_id:d.instance_id,version:1,previous_version:0,payload:d.payload});
            }
          }
          if(append.length!==ea.length) throw new Error("append count "+append.length+" != "+ea.length);
          if(current.length!==ec.length) throw new Error("current count "+current.length+" != "+ec.length);
          const ak=x=>[x.dataset_id,x.instance_id,x.record_key].join("|");
          const am=new Map(append.map(x=>[ak(x),x]));
          for(const e of ea){
            const a=am.get(ak(e));
            if(!a) throw new Error("missing append "+ak(e));
            if(JSON.stringify(JSON.parse(a.payload_json))!==JSON.stringify(e.payload)) throw new Error("append payload mismatch "+ak(e));
          }
          const ck=x=>[x.dataset_id,x.instance_id,x.version].join("|");
          const cm=new Map(current.map(x=>[ck(x),x]));
          for(const e of ec){
            const a=cm.get(ck(e));
            if(!a) throw new Error("missing current "+ck(e));
            if(Number(a.previous_version)!==0) throw new Error("previous version mismatch "+ck(e));
            if(JSON.stringify(JSON.parse(a.payload_json))!==JSON.stringify(e.payload)) throw new Error("current payload mismatch "+ck(e));
          }
          console.log("CURRENT_D1_BASELINE_RECONCILIATION=PASS");
          console.log("CURRENT_D1_APPEND_ROWS="+append.length);
          console.log("CURRENT_D1_CURRENT_STATE_VERSIONS="+current.length);
          NODE
