name: Direct Prototype 0 TIME_ROUNDTRIP Acceptance

on:
  issues:
    types:
      - opened

jobs:
  accept:
    if: github.event.issue.title == '[TIME_ROUNDTRIP] DIRECT_ACCEPTANCE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required secrets are available
        run: |
          test -n "$RUNTIME_SECRET"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install

      - name: Execute authenticated TIME_ROUNDTRIP
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN_KEY="direct-acceptance-issue-${{ github.event.issue.number }}"
          BODY_FILE="$(mktemp)"
          REQUEST_FILE="$(mktemp)"

          jq -n             --arg source "$SOURCE_RUN_KEY"             '{
              execution_surface: "CHAT",
              trigger_mode: "HUMAN",
              operation: "TIME_ROUNDTRIP",
              source_run_key: $source
            }' > "$REQUEST_FILE"

          HTTP_CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}'             -X POST https://d1-runtime-prototype.lennyliu01.workers.dev/prototype/time-roundtrip             -H "Authorization: Bearer $RUNTIME_SECRET"             -H 'Content-Type: application/json'             --data-binary @"$REQUEST_FILE")"

          RESPONSE="$(cat "$BODY_FILE")"
          echo "HTTP: $HTTP_CODE"
          echo "Runtime response: $RESPONSE"

          test "$HTTP_CODE" = "200"
          echo "$RESPONSE" | jq -e '
            .status == "SUCCESS" and
            .execution_surface == "CHAT" and
            .trigger_mode == "HUMAN" and
            .operation == "TIME_ROUNDTRIP" and
            .stored_status == "RECORDED" and
            (.invocation_id | type == "string" and length > 0) and
            (.db_written_at | type == "string" and length > 0) and
            (.db_read_at | type == "string" and length > 0)
          ' >/dev/null

          INVOCATION_ID="$(echo "$RESPONSE" | jq -r '.invocation_id')"
          DB_WRITTEN_AT="$(echo "$RESPONSE" | jq -r '.db_written_at')"
          DB_READ_AT="$(echo "$RESPONSE" | jq -r '.db_read_at')"

          echo "invocation_id=$INVOCATION_ID" >> "$GITHUB_OUTPUT"
          echo "db_written_at=$DB_WRITTEN_AT" >> "$GITHUB_OUTPUT"
          echo "db_read_at=$DB_READ_AT" >> "$GITHUB_OUTPUT"
          echo "source_run_key=$SOURCE_RUN_KEY" >> "$GITHUB_OUTPUT"

      - name: Independently verify exact D1 row
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          INVOCATION_ID="${{ steps.runtime.outputs.invocation_id }}"
          DB_WRITTEN_AT="${{ steps.runtime.outputs.db_written_at }}"
          SOURCE_RUN_KEY="${{ steps.runtime.outputs.source_run_key }}"

          QUERY="SELECT invocation_id, execution_surface, trigger_mode, operation, db_written_at, status, source_run_key FROM prototype_invocations WHERE invocation_id = '$INVOCATION_ID';"

          npx wrangler d1 execute d1-runtime-prototype-db             --remote             --json             --command "$QUERY" > d1-result.json

          echo "Independent D1 query result:"
          cat d1-result.json

          jq -e             --arg id "$INVOCATION_ID"             --arg written "$DB_WRITTEN_AT"             --arg source "$SOURCE_RUN_KEY"             '
            [
              .. | objects |
              select(
                .invocation_id? == $id and
                .execution_surface? == "CHAT" and
                .trigger_mode? == "HUMAN" and
                .operation? == "TIME_ROUNDTRIP" and
                .db_written_at? == $written and
                .status? == "RECORDED" and
                .source_run_key? == $source
              )
            ] | length == 1
            ' d1-result.json >/dev/null

      - name: Post acceptance success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INVOCATION_ID: ${{ steps.runtime.outputs.invocation_id }}
          DB_WRITTEN_AT: ${{ steps.runtime.outputs.db_written_at }}
          DB_READ_AT: ${{ steps.runtime.outputs.db_read_at }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "TIME_ROUNDTRIP_DIRECT_RESULT
          Status: SUCCESS
          Invocation_ID: $INVOCATION_ID
          Execution_Surface: CHAT
          Trigger_Mode: HUMAN
          Operation: TIME_ROUNDTRIP
          Stored_Status: RECORDED
          DB_Written_At: $DB_WRITTEN_AT
          DB_Read_At: $DB_READ_AT
          Independent_D1_Exact_Row_Verification: SUCCESS"

      - name: Post acceptance failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "TIME_ROUNDTRIP_DIRECT_RESULT
          Status: FAILED
          Inspect the matching GitHub Actions run for the exact failed step."
