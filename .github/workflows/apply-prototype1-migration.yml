name: Apply Prototype 1 D1 Migration

on:
  issues:
    types:
      - opened

jobs:
  migrate:
    if: github.event.issue.title == '[D1_MIGRATION] APPLY_PROTOTYPE_1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are available
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install

      - name: Apply pending remote D1 migrations
        run: npx wrangler d1 migrations apply d1-runtime-prototype-db --remote

      - name: Verify Prototype 1 table and schema
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='prototype_state_versions';")"
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -F 'prototype_state_versions'
          printf '%s\n' "$OUT" | grep -F 'state_key'
          printf '%s\n' "$OUT" | grep -F 'version'
          printf '%s\n' "$OUT" | grep -F 'idempotency_key'

      - name: Verify Prototype 1 table is queryable
        run: |
          npx wrangler d1 execute d1-runtime-prototype-db --remote --command "SELECT COUNT(*) AS row_count FROM prototype_state_versions;"

      - name: Post migration success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "D1_MIGRATION_RESULT
          Status: SUCCESS
          Prototype: 1
          Database: d1-runtime-prototype-db
          Table: prototype_state_versions
          Migration: 0002_create_prototype_state_versions.sql
          Table_Queryable: YES"

      - name: Post migration failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "D1_MIGRATION_RESULT
          Status: FAILED
          Prototype: 1
          Database: d1-runtime-prototype-db
          Migration: 0002_create_prototype_state_versions.sql
          Inspect the matching GitHub Actions run for the exact failed step."
