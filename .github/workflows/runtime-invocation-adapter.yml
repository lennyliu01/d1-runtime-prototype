name: Prototype Runtime Invocation Adapter

on:
  issues:
    types:
      - opened

jobs:
  invoke:
    if: >-
      github.event.issue.title == '[RUNTIME_INVOCATION] TIME_ROUNDTRIP' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] STATE_COMPARE_AND_SET' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] READ' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] WRITE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
    steps:
      - name: Validate invocation and call shared runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_SECRET"

          BODY="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          TITLE="$(jq -r '.issue.title // ""' "$GITHUB_EVENT_PATH")"
          EXECUTION_SURFACE="$(printf '%s\n' "$BODY" | awk -F': ' '/^Execution_Surface: / {print $2; exit}')"
          TRIGGER_MODE="$(printf '%s\n' "$BODY" | awk -F': ' '/^Trigger_Mode: / {print $2; exit}')"
          OPERATION="$(printf '%s\n' "$BODY" | awk -F': ' '/^Operation: / {print $2; exit}')"

          case "$EXECUTION_SURFACE" in CHAT|WORK) ;; *) echo "Invalid Execution_Surface"; exit 21 ;; esac
          case "$TRIGGER_MODE" in HUMAN|SCHEDULE) ;; *) echo "Invalid Trigger_Mode"; exit 22 ;; esac

          SOURCE_RUN_KEY="github-issue-${{ github.event.issue.number }}"
          REQUEST_FILE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"

          if [ "$OPERATION" = "TIME_ROUNDTRIP" ]; then
            test "$TITLE" = "[RUNTIME_INVOCATION] TIME_ROUNDTRIP"

            jq -n \
              --arg surface "$EXECUTION_SURFACE" \
              --arg trigger "$TRIGGER_MODE" \
              --arg source "$SOURCE_RUN_KEY" \
              '{
                execution_surface: $surface,
                trigger_mode: $trigger,
                operation: "TIME_ROUNDTRIP",
                source_run_key: $source
              }' > "$REQUEST_FILE"

            ENDPOINT="https://d1-runtime-prototype.lennyliu01.workers.dev/prototype/time-roundtrip"

          elif [ "$OPERATION" = "STATE_COMPARE_AND_SET" ]; then
            test "$TITLE" = "[RUNTIME_INVOCATION] STATE_COMPARE_AND_SET"

            STATE_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^State_Key: / {print $2; exit}')"
            EXPECTED_VERSION="$(printf '%s\n' "$BODY" | awk -F': ' '/^Expected_Version: / {print $2; exit}')"
            EXPECTED_STATE="$(printf '%s\n' "$BODY" | awk -F': ' '/^Expected_State: / {print $2; exit}')"
            NEXT_STATE="$(printf '%s\n' "$BODY" | awk -F': ' '/^Next_State: / {print $2; exit}')"
            IDEMPOTENCY_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Idempotency_Key: / {print $2; exit}')"

            [[ "$STATE_KEY" =~ ^[A-Za-z0-9._:-]{1,64}$ ]] || { echo "Invalid State_Key"; exit 23; }
            [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "Invalid Expected_Version"; exit 24; }
            test "$EXPECTED_VERSION" -le 2147483647 || { echo "Expected_Version too large"; exit 25; }
            [[ "$NEXT_STATE" =~ ^[A-Za-z0-9._:-]{1,64}$ ]] || { echo "Invalid Next_State"; exit 26; }
            [[ "$IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Idempotency_Key"; exit 27; }

            if [ "$EXPECTED_VERSION" = "0" ]; then
              test "$EXPECTED_STATE" = "null" || { echo "Expected_State must be null for version 0"; exit 28; }
              jq -n \
                --arg surface "$EXECUTION_SURFACE" \
                --arg trigger "$TRIGGER_MODE" \
                --arg state_key "$STATE_KEY" \
                --argjson expected_version "$EXPECTED_VERSION" \
                --arg next_state "$NEXT_STATE" \
                --arg idempotency_key "$IDEMPOTENCY_KEY" \
                --arg source "$SOURCE_RUN_KEY" \
                '{
                  execution_surface: $surface,
                  trigger_mode: $trigger,
                  operation: "STATE_COMPARE_AND_SET",
                  state_key: $state_key,
                  expected_version: $expected_version,
                  expected_state: null,
                  next_state: $next_state,
                  idempotency_key: $idempotency_key,
                  source_run_key: $source
                }' > "$REQUEST_FILE"
            else
              [[ "$EXPECTED_STATE" =~ ^[A-Za-z0-9._:-]{1,64}$ ]] || { echo "Invalid Expected_State"; exit 29; }
              test "$NEXT_STATE" != "$EXPECTED_STATE" || { echo "Next_State must differ from Expected_State"; exit 30; }
              jq -n \
                --arg surface "$EXECUTION_SURFACE" \
                --arg trigger "$TRIGGER_MODE" \
                --arg state_key "$STATE_KEY" \
                --argjson expected_version "$EXPECTED_VERSION" \
                --arg expected_state "$EXPECTED_STATE" \
                --arg next_state "$NEXT_STATE" \
                --arg idempotency_key "$IDEMPOTENCY_KEY" \
                --arg source "$SOURCE_RUN_KEY" \
                '{
                  execution_surface: $surface,
                  trigger_mode: $trigger,
                  operation: "STATE_COMPARE_AND_SET",
                  state_key: $state_key,
                  expected_version: $expected_version,
                  expected_state: $expected_state,
                  next_state: $next_state,
                  idempotency_key: $idempotency_key,
                  source_run_key: $source
                }' > "$REQUEST_FILE"
            fi

            ENDPOINT="https://d1-runtime-prototype.lennyliu01.workers.dev/prototype/state-cas"

          elif [ "$OPERATION" = "READ" ] || [ "$OPERATION" = "WRITE" ]; then
            test "$TITLE" = "[RUNTIME_INVOCATION] $OPERATION"

            TASK_ID="$(printf '%s\n' "$BODY" | awk -F': ' '/^Task_ID: / {print $2; exit}')"
            CALLER_IDENTITY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Caller_Identity: / {print $2; exit}')"
            DATASET_ID="$(printf '%s\n' "$BODY" | awk -F': ' '/^Dataset_ID: / {print $2; exit}')"
            INSTANCE_ID="$(printf '%s\n' "$BODY" | awk -F': ' '/^Instance_ID: / {print $2; exit}')"

            [[ "$TASK_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Task_ID"; exit 33; }
            [[ "$CALLER_IDENTITY" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Caller_Identity"; exit 34; }
            [[ "$DATASET_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Dataset_ID"; exit 35; }
            [[ "$INSTANCE_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Instance_ID"; exit 36; }

            if [ "$OPERATION" = "READ" ]; then
              SELECTOR="$(printf '%s\n' "$BODY" | awk -F': ' '/^Selector: / {print $2; exit}')"
              case "$SELECTOR" in
                CURRENT)
                  SELECTOR_JSON='{"kind":"CURRENT"}'
                  ;;
                RECORD)
                  RECORD_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Record_Key: / {print $2; exit}')"
                  [[ "$RECORD_KEY" =~ ^[A-Za-z0-9._:-]{1,256}$ ]] || { echo "Invalid Record_Key"; exit 37; }
                  SELECTOR_JSON="$(jq -cn --arg key "$RECORD_KEY" '{kind:"RECORD",record_key:$key}')"
                  ;;
                AFTER)
                  CHECKPOINT_RECORD_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Checkpoint_Record_Key: / {print $2; exit}')"
                  LIMIT="$(printf '%s\n' "$BODY" | awk -F': ' '/^Limit: / {print $2; exit}')"
                  [[ "$CHECKPOINT_RECORD_KEY" =~ ^[A-Za-z0-9._:-]{1,256}$ ]] || { echo "Invalid Checkpoint_Record_Key"; exit 38; }
                  [[ "$LIMIT" =~ ^[1-9][0-9]?$|^100$ ]] || { echo "Invalid Limit"; exit 39; }
                  SELECTOR_JSON="$(jq -cn --arg key "$CHECKPOINT_RECORD_KEY" --argjson limit "$LIMIT" '{kind:"AFTER",checkpoint_record_key:$key,limit:$limit}')"
                  ;;
                TAIL)
                  LIMIT="$(printf '%s\n' "$BODY" | awk -F': ' '/^Limit: / {print $2; exit}')"
                  [[ "$LIMIT" =~ ^[1-9][0-9]?$|^100$ ]] || { echo "Invalid Limit"; exit 40; }
                  SELECTOR_JSON="$(jq -cn --argjson limit "$LIMIT" '{kind:"TAIL",limit:$limit}')"
                  ;;
                *)
                  echo "Invalid Selector"
                  exit 41
                  ;;
              esac

              jq -n \
                --arg surface "$EXECUTION_SURFACE" \
                --arg trigger "$TRIGGER_MODE" \
                --arg task "$TASK_ID" \
                --arg caller "$CALLER_IDENTITY" \
                --arg dataset "$DATASET_ID" \
                --arg instance "$INSTANCE_ID" \
                --argjson selector "$SELECTOR_JSON" \
                '{
                  execution_surface: $surface,
                  trigger_mode: $trigger,
                  task_id: $task,
                  caller_identity: $caller,
                  operation: "READ",
                  dataset_id: $dataset,
                  instance_id: $instance,
                  selector: $selector
                }' > "$REQUEST_FILE"

            else
              IDEMPOTENCY_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Idempotency_Key: / {print $2; exit}')"
              PAYLOAD_JSON="$(printf '%s\n' "$BODY" | sed -n 's/^Payload_JSON: //p' | head -n 1)"
              RECORD_KEY="$(printf '%s\n' "$BODY" | awk -F': ' '/^Record_Key: / {print $2; exit}')"
              EXPECTED_VERSION="$(printf '%s\n' "$BODY" | awk -F': ' '/^Expected_Version: / {print $2; exit}')"

              [[ "$IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "Invalid Idempotency_Key"; exit 42; }
              test -n "$PAYLOAD_JSON" || { echo "Missing Payload_JSON"; exit 43; }
              printf '%s' "$PAYLOAD_JSON" | jq -e . >/dev/null || { echo "Invalid Payload_JSON"; exit 44; }

              jq -n \
                --arg surface "$EXECUTION_SURFACE" \
                --arg trigger "$TRIGGER_MODE" \
                --arg task "$TASK_ID" \
                --arg caller "$CALLER_IDENTITY" \
                --arg dataset "$DATASET_ID" \
                --arg instance "$INSTANCE_ID" \
                --arg idempotency "$IDEMPOTENCY_KEY" \
                --argjson payload "$PAYLOAD_JSON" \
                '{
                  execution_surface: $surface,
                  trigger_mode: $trigger,
                  task_id: $task,
                  caller_identity: $caller,
                  operation: "WRITE",
                  dataset_id: $dataset,
                  instance_id: $instance,
                  idempotency_key: $idempotency,
                  payload: $payload
                }' > "$REQUEST_FILE"

              if [ -n "$RECORD_KEY" ]; then
                [[ "$RECORD_KEY" =~ ^[A-Za-z0-9._:-]{1,256}$ ]] || { echo "Invalid Record_Key"; exit 45; }
                jq --arg key "$RECORD_KEY" '. + {record_key:$key}' "$REQUEST_FILE" > "$REQUEST_FILE.tmp"
                mv "$REQUEST_FILE.tmp" "$REQUEST_FILE"
              fi

              if [ -n "$EXPECTED_VERSION" ]; then
                [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "Invalid Expected_Version"; exit 46; }
                test "$EXPECTED_VERSION" -le 2147483647 || { echo "Expected_Version too large"; exit 47; }
                jq --argjson version "$EXPECTED_VERSION" '. + {expected_version:$version}' "$REQUEST_FILE" > "$REQUEST_FILE.tmp"
                mv "$REQUEST_FILE.tmp" "$REQUEST_FILE"
              fi
            fi

            ENDPOINT="https://workos-d1-runtime.lennyliu01.workers.dev/candidate/workos-persistence"
          else
            echo "Invalid Operation"
            exit 31
          fi

          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $RUNTIME_SECRET" \
            -H 'Content-Type: application/json' \
            --data-binary @"$REQUEST_FILE")"

          RESPONSE="$(cat "$RESPONSE_FILE")"
          echo "Runtime HTTP: $HTTP_CODE"
          echo "Runtime response: $RESPONSE"

          if [ "$OPERATION" = "TIME_ROUNDTRIP" ]; then
            test "$HTTP_CODE" = "200"
            echo "$RESPONSE" | jq -e \
              --arg surface "$EXECUTION_SURFACE" \
              --arg trigger "$TRIGGER_MODE" \
              '
                .status == "SUCCESS" and
                .execution_surface == $surface and
                .trigger_mode == $trigger and
                .operation == "TIME_ROUNDTRIP" and
                .stored_status == "RECORDED" and
                (.invocation_id | type == "string" and length > 0) and
                (.db_written_at | type == "string" and length > 0) and
                (.db_read_at | type == "string" and length > 0)
              ' >/dev/null
          elif [ "$OPERATION" = "READ" ] || [ "$OPERATION" = "WRITE" ]; then
            case "$HTTP_CODE" in
              200)
                echo "$RESPONSE" | jq -e --arg operation "$OPERATION" '
                  .status == "SUCCESS" and .operation == $operation
                ' >/dev/null
                ;;
              403|404|409)
                echo "$RESPONSE" | jq -e '.status == "FAILED" and (.error | type == "string" and length > 0)' >/dev/null
                ;;
              *)
                echo "Unexpected WorkOS candidate HTTP status: $HTTP_CODE"
                exit 48
                ;;
            esac
          else
            if [ "$HTTP_CODE" = "200" ]; then
              echo "$RESPONSE" | jq -e \
                --arg surface "$EXECUTION_SURFACE" \
                --arg trigger "$TRIGGER_MODE" \
                '
                  .status == "SUCCESS" and
                  .execution_surface == $surface and
                  .trigger_mode == $trigger and
                  .operation == "STATE_COMPARE_AND_SET" and
                  (.invocation_id | type == "string" and length > 0) and
                  (.state_key | type == "string" and length > 0) and
                  (.version | type == "number") and
                  (.state | type == "string" and length > 0) and
                  (.idempotency_key | type == "string" and length > 0) and
                  (.db_written_at | type == "string" and length > 0) and
                  (.db_read_at | type == "string" and length > 0) and
                  (.replayed | type == "boolean")
                ' >/dev/null
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "$RESPONSE" | jq -e \
                '
                  .status == "FAILED" and
                  (.error == "STALE_STATE" or .error == "IDEMPOTENCY_CONFLICT")
                ' >/dev/null
            else
              echo "Unexpected STATE_COMPARE_AND_SET HTTP status: $HTTP_CODE"
              exit 32
            fi
          fi

          echo "execution_surface=$EXECUTION_SURFACE" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$TRIGGER_MODE" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "runtime_status=$(echo "$RESPONSE" | jq -r '.status')" >> "$GITHUB_OUTPUT"
          echo "runtime_error=$(echo "$RESPONSE" | jq -r '.error // ""')" >> "$GITHUB_OUTPUT"
          echo "invocation_id=$(echo "$RESPONSE" | jq -r '.invocation_id // ""')" >> "$GITHUB_OUTPUT"
          echo "db_written_at=$(echo "$RESPONSE" | jq -r '.db_written_at // ""')" >> "$GITHUB_OUTPUT"
          echo "db_read_at=$(echo "$RESPONSE" | jq -r '.db_read_at // ""')" >> "$GITHUB_OUTPUT"
          echo "stored_status=$(echo "$RESPONSE" | jq -r '.stored_status // ""')" >> "$GITHUB_OUTPUT"
          echo "state_key=$(echo "$RESPONSE" | jq -r '.state_key // ""')" >> "$GITHUB_OUTPUT"
          echo "previous_version=$(echo "$RESPONSE" | jq -r '.previous_version // ""')" >> "$GITHUB_OUTPUT"
          echo "previous_state=$(echo "$RESPONSE" | jq -r 'if has("previous_state") then (.previous_state|tostring) else "" end')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$RESPONSE" | jq -r '.version // ""')" >> "$GITHUB_OUTPUT"
          echo "state=$(echo "$RESPONSE" | jq -r '.state // ""')" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$(echo "$RESPONSE" | jq -r '.idempotency_key // ""')" >> "$GITHUB_OUTPUT"
          echo "replayed=$(echo "$RESPONSE" | jq -r 'if has("replayed") then (.replayed|tostring) else "" end')" >> "$GITHUB_OUTPUT"
          echo "current_version=$(echo "$RESPONSE" | jq -r '.current_version // ""')" >> "$GITHUB_OUTPUT"
          echo "current_state=$(echo "$RESPONSE" | jq -r 'if has("current_state") then (.current_state|tostring) else "" end')" >> "$GITHUB_OUTPUT"
          echo "source_run_key=$SOURCE_RUN_KEY" >> "$GITHUB_OUTPUT"
          echo "runtime_response=$(echo "$RESPONSE" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Return terminal runtime result to exact issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXECUTION_SURFACE: ${{ steps.runtime.outputs.execution_surface }}
          TRIGGER_MODE: ${{ steps.runtime.outputs.trigger_mode }}
          OPERATION: ${{ steps.runtime.outputs.operation }}
          HTTP_CODE: ${{ steps.runtime.outputs.http_code }}
          RUNTIME_STATUS: ${{ steps.runtime.outputs.runtime_status }}
          RUNTIME_ERROR: ${{ steps.runtime.outputs.runtime_error }}
          INVOCATION_ID: ${{ steps.runtime.outputs.invocation_id }}
          DB_WRITTEN_AT: ${{ steps.runtime.outputs.db_written_at }}
          DB_READ_AT: ${{ steps.runtime.outputs.db_read_at }}
          STORED_STATUS: ${{ steps.runtime.outputs.stored_status }}
          STATE_KEY: ${{ steps.runtime.outputs.state_key }}
          PREVIOUS_VERSION: ${{ steps.runtime.outputs.previous_version }}
          PREVIOUS_STATE: ${{ steps.runtime.outputs.previous_state }}
          VERSION: ${{ steps.runtime.outputs.version }}
          STATE: ${{ steps.runtime.outputs.state }}
          IDEMPOTENCY_KEY: ${{ steps.runtime.outputs.idempotency_key }}
          REPLAYED: ${{ steps.runtime.outputs.replayed }}
          CURRENT_VERSION: ${{ steps.runtime.outputs.current_version }}
          CURRENT_STATE: ${{ steps.runtime.outputs.current_state }}
          SOURCE_RUN_KEY: ${{ steps.runtime.outputs.source_run_key }}
          RUNTIME_RESPONSE: ${{ steps.runtime.outputs.runtime_response }}
        run: |
          if [ "$OPERATION" = "READ" ] || [ "$OPERATION" = "WRITE" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
            Status: $RUNTIME_STATUS
            HTTP: $HTTP_CODE
            Execution_Surface: $EXECUTION_SURFACE
            Trigger_Mode: $TRIGGER_MODE
            Operation: $OPERATION
            Runtime_Result_JSON: $RUNTIME_RESPONSE
            Source_Run_Key: $SOURCE_RUN_KEY
            Return_Target: CALLER
            Transport: GITHUB_ACTIONS"
          elif [ "$OPERATION" = "TIME_ROUNDTRIP" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
            Invocation_ID: $INVOCATION_ID
            Status: $RUNTIME_STATUS
            Execution_Surface: $EXECUTION_SURFACE
            Trigger_Mode: $TRIGGER_MODE
            Operation: TIME_ROUNDTRIP
            Stored_Status: $STORED_STATUS
            DB_Written_At: $DB_WRITTEN_AT
            DB_Read_At: $DB_READ_AT
            Source_Run_Key: $SOURCE_RUN_KEY
            Return_Target: CALLER
            Transport: GITHUB_ACTIONS"
          elif [ "$RUNTIME_STATUS" = "SUCCESS" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
            Invocation_ID: $INVOCATION_ID
            Status: SUCCESS
            HTTP: $HTTP_CODE
            Execution_Surface: $EXECUTION_SURFACE
            Trigger_Mode: $TRIGGER_MODE
            Operation: STATE_COMPARE_AND_SET
            State_Key: $STATE_KEY
            Previous_Version: $PREVIOUS_VERSION
            Previous_State: $PREVIOUS_STATE
            Version: $VERSION
            State: $STATE
            Idempotency_Key: $IDEMPOTENCY_KEY
            Replayed: $REPLAYED
            DB_Written_At: $DB_WRITTEN_AT
            DB_Read_At: $DB_READ_AT
            Source_Run_Key: $SOURCE_RUN_KEY
            Return_Target: CALLER
            Transport: GITHUB_ACTIONS"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
            Status: FAILED
            HTTP: $HTTP_CODE
            Error: $RUNTIME_ERROR
            Execution_Surface: $EXECUTION_SURFACE
            Trigger_Mode: $TRIGGER_MODE
            Operation: STATE_COMPARE_AND_SET
            State_Key: $STATE_KEY
            Current_Version: $CURRENT_VERSION
            Current_State: $CURRENT_STATE
            Source_Run_Key: $SOURCE_RUN_KEY
            Return_Target: CALLER
            Transport: GITHUB_ACTIONS"
          fi

      - name: Return terminal adapter failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
          Status: FAILED
          Error: ADAPTER_OR_RUNTIME_FAILURE
          Return_Target: CALLER
          Transport: GITHUB_ACTIONS"
