name: Adapter Qualification Probe

on:
  issues:
    types:
      - opened

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[ADAPTER_PROBE]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post terminal adapter result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "ADAPTER_PROBE_RESULT
          Invocation_ID: GH-ISSUE-$ISSUE_NUMBER
          Status: SUCCESS
          Return_Target: CALLER
          Transport: GITHUB_ACTIONS"
